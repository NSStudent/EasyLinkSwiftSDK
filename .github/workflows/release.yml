name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      - name: Generate DocC Static Site
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation --target EasyLinkSwiftSDK \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path EasyLinkSwiftSDK \
            --output-path ./docs

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          enable_jekyll: false
          cname: nsstudent.dev
